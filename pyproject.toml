[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-agent"
version = "0.1.0"
description = "Patient-appointment scheduling agent with a self-improving evaluation loop"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "anthropic>=0.40",
  "openai>=1.40",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
